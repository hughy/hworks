<!doctype html>
<html><head><meta charset="utf-8"><title>Transfer limits demo</title>
<style>
body{font-family:-apple-system,"Segoe UI",sans-serif;margin:40px;color:#111}
.row{display:flex;align-items:center;gap:16px;padding:14px 18px;border:1px solid #ddd;border-radius:10px;margin:10px 0;width:640px}
.row .name{flex:1}.row .status{width:110px;font-weight:600}
#limit{margin-top:24px;padding:12px 18px;border:1px solid #ddd;border-radius:10px;width:640px}
</style></head><body>
<h1>Transfer limits</h1>
<div class="row" data-testid="row-small" data-status="none"><span class="name">Send $50</span><span class="status">Not run</span><button data-testid="run-small">Run</button></div>
<div class="row" data-testid="row-large" data-status="none"><span class="name">Send $5,000</span><span class="status">Not run</span><button data-testid="run-large">Run</button></div>
<div id="limit" data-testid="limit">Per-transfer limit: $1,000</div>
<script>
for (const [id, ok] of [["small", true], ["large", false]]) {
  document.querySelector(`[data-testid="run-${id}"]`).onclick = () => {
    const row = document.querySelector(`[data-testid="row-${id}"]`);
    row.dataset.status = "running"; row.querySelector(".status").textContent = "Running...";
    setTimeout(() => { row.dataset.status = ok ? "sent" : "blocked"; row.querySelector(".status").textContent = ok ? "Sent" : "Blocked"; }, 1200);
  };
}
</script></body></html>
