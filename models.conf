# profile role model
# scripts/models.sh writes each agent role's model to pi settings; agent files carry no model line.
# A role without an agent file is a slot that hughy-mode reads for per-call overrides:
#   review2     the second reviewer; a different provider from reviewer when the profile has two.
#   exhaustive  the coder model at exhaustive effort.
# Keep review2 off the top-cost tier; it runs on every two-reviewer pass.
# `-` removes the override so the role uses the session model.
# Add local profiles in models.d/*.conf (gitignored), same format.
inherit coder -
inherit reviewer -
inherit explorer -
inherit synthesizer -
inherit review2 -
inherit exhaustive -
anthropic coder anthropic/claude-opus-5-5
anthropic reviewer anthropic/claude-opus-5-5
anthropic explorer anthropic/claude-haiku-4-5
anthropic synthesizer anthropic/claude-opus-5-5
anthropic review2 anthropic/claude-opus-5-5
anthropic exhaustive anthropic/claude-fable-5-1
